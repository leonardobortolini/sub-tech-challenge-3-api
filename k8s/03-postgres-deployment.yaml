apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: revenda

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

        - name: postgres
          image: postgres:15

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: revenda-config
                  key: POSTGRES_DB


            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: revenda-secret
                  key: POSTGRES_USER


            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revenda-secret
                  key: POSTGRES_PASSWORD
